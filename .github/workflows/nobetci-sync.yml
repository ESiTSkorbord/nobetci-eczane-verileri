name: Nobetci Eczane Senkronizasyonu

# Bu workflow GitHub'in kendi sunucularinda calisir - Enver'in bilgisayarinin
# acik olmasina, hicbir sunucu/hosting'e gerek yoktur. Sadece bu dosya depoya
# eklenince otomatik devreye girer.

on:
  # 2 Ekim guncellemesi: GitHub'in KENDI "schedule:" cron tetikleyicisi
  # (saatte 4 kez, 7/22/37/52. dakikalar) guvenilmez cikti - GitHub bazen
  # bunu "kafasina gore" geciktirip/atliyordu. Enver bunun yerine DISARIDAN
  # cron-job.org servisini kullanarak GitHub'in /actions/workflows/
  # nobetci-sync.yml/dispatches API ucuna saatte 1 kez (her saat basi
  # :00:55'te) dogrudan istek atiyor - bu, asagidaki "workflow_dispatch"
  # tetikleyicisini kullanir. "schedule:" bloğu BILEREK KALDIRILDI: hem
  # guvenilmezdi hem de duruyor olsaydi cron-job.org'un saatlik cagrisinin
  # USTUNE binip gereksiz/karisik fazladan calistirmalara yol acabilirdi.
  # Tetikleme artik TAMAMEN cron-job.org'un elinde, net ve tek kaynaktan.
  workflow_dispatch: {}
    # Yukaridaki satir iki ise yarar: (1) cron-job.org'un cagirdigi GitHub
    # API ucu tam olarak budur, (2) Actions sekmesinden elle "Run workflow"
    # ile de calistirilabilir (test icin kullanisli).

permissions:
  contents: write

jobs:
  senkronize:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nobetci verisini senkronize et
        env:
          COLLECTAPI_KEY: ${{ secrets.COLLECTAPI_KEY }}
        run: python scripts/senkronize.py

      - name: Degisiklik varsa commit+push yap
        run: |
          git config user.name "nobetci-eczane-bot"
          git config user.email "nobetci-eczane-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atilmayacak."
          else
            git commit -m "Otomatik nobetci eczane senkronizasyonu"
            git push
          fi
