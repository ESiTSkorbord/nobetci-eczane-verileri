name: Odasi Sayfa Denemesi

# SADECE elle calistirilir (Actions > Run workflow). data/ klasorune dokunmaz, test/odasi/ altina yazar.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  odasi:
    runs-on: ubuntu-24.04
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Playwright kur
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Odasi sayfasini oku
        run: python scripts/odasi_test.py

      - name: Sonucu depoya yaz
        if: always()
        run: |
          git config user.name "nobetci-eczane-bot"
          git config user.email "nobetci-eczane-bot@users.noreply.github.com"
          git add test/odasi/
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Odasi sayfa denemesi"
            git pull --rebase
            git push
          fi
