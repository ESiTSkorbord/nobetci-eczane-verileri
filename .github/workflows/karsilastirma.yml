name: Nobetci Eczane Kaynak Karsilastirma (test)

# 2 Ekim guncellemesi: CollectAPI artik senkronize.py icinde GERCEK
# ENTEGRASYON olarak devrede (bkz. nobetci-sync.yml + scripts/senkronize.py,
# data/collectapi-eklenenler-log.txt). Bu workflow'un gunluk otomatik
# calismasi KAPATILDI - CollectAPI'yi gunde 2. kez (hem burada hem
# senkronize.py'de) cagirip ucretsiz kotayi (ayda 100 istek) gereksiz yere
# iki katina cikarmamak icin. Dosya SILINMEDI, "Run workflow" ile ELLE
# istenildiginde hala calistirilabilir (orn. ileride baska bir il/ilce
# eklenince tekrar dogrulama yapmak icin kullanisli).

on:
  workflow_dispatch: {}
    # Sadece elle "Run workflow" ile calistirilir - otomatik cron KAPALI.

permissions:
  contents: write

jobs:
  karsilastir:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaynaklari karsilastir
        env:
          COLLECTAPI_KEY: ${{ secrets.COLLECTAPI_KEY }}
        run: python scripts/karsilastir.py

      - name: Log dosyasini commit+push yap
        run: |
          git config user.name "nobetci-eczane-bot"
          git config user.email "nobetci-eczane-bot@users.noreply.github.com"
          git add data/karsilastirma-log.txt
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atilmayacak."
          else
            git commit -m "Kaynak karsilastirma log guncellemesi"
            git push
          fi
